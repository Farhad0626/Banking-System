[project]
name = "banking-system"
version = "0.1.0"
description = "Core Banking System - Clean Architecture (PRD v1.2)"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py314"